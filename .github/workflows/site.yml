name: site

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # every Monday, catches links that died since the last push

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Every number still matches its pinned evidence
        run: npm run check:claims

      - name: Build
        run: npm run build

      - name: No broken links
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/dist
            --exclude 'linkedin\.com'
            --exclude 'localhost'
            'dist/**/*.html'
